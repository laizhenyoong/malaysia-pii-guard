[project]
name = "pii-guard"
version = "0.1.0"
description = "Malaysian PII recognizers for Microsoft Presidio"
requires-python = ">=3.9"
dependencies = ["presidio-analyzer>=2.2"]

[project.optional-dependencies]
test = ["pytest", "presidio-anonymizer>=2.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pii_guard*"]
