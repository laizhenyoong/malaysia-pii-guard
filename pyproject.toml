[project]
name = "malaysia-pii-guard"
version = "0.1.0"
description = "Guard Malaysian personal information: detect, mask, and restore MyKad, phone, passport, and bank account numbers"
requires-python = ">=3.9"
dependencies = ["phonenumbers>=9.0"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["malaysia_pii_guard*"]
